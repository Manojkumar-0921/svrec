<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | SVREC Academic Hub</title><link rel="stylesheet" href="css/style.css"></head>
<body><div id="nav"></div>
<main class="container"><div class="card auth">
  <h1>Welcome back</h1>
  <div class="tabs" role="tablist"><button role="tab" id="tabLogin" aria-selected="true">Login</button><button role="tab" id="tabReg" aria-selected="false">Register</button></div>
  <div id="msg"></div>
  <form id="form" novalidate>
    <label id="nameWrap" hidden>Full name<input id="name" autocomplete="name"></label>
    <label>College email<input id="email" type="email" placeholder="name@svrec.ac.in" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div id="regFields" hidden>
      <label>Department<select id="department"></select></label>
      <label>Semester<select id="semester"></select></label>
    </div>
    <button class="btn" id="submit" style="width:100%">Login</button>
  </form>
  <p class="muted" style="margin-top:1rem;font-size:.85rem">Demo accounts: student@svrec.ac.in / student123 · admin@svrec.ac.in / admin123</p>
</div></main>
<div id="footer"></div>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/demo.js"></script><script src="js/api.js"></script>
<script src="js/login.js"></script>
<script>renderNav('login.html');</script></body></html>
